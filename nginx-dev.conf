# Local Dev Reverse Proxy — Raghuvir Consultants
# Routes hostname-based traffic to correct Vite dev servers
# Usage: sudo nginx -c /Users/harshitsuthar/workspace/raghuvirconsultants-site/nginx-dev.conf

# Avoid conflict with system nginx pid
pid /tmp/nginx-raghuvir-dev.pid;

events {
  worker_connections 1024;
}

http {
  # Main Site & Investor Portal → frontend (port 5173)
  server {
    listen 80;
    server_name raghuvircons.local;

    location / {
      proxy_pass http://127.0.0.1:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }
  }

  # Admin Dashboard → admin-dashboard (port 5174)
  server {
    listen 80;
    server_name app.raghuvircons.local;

    location / {
      proxy_pass http://127.0.0.1:5174;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }
  }
}
